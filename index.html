<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jinx Kids Store</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kantumruy Pro', sans-serif; }
    </style>
</head>
<body class="bg-pink-50 min-h-screen pb-12">

    <!-- Header / Navbar -->
    <div class="max-w-4xl mx-auto p-4 flex justify-between items-center mb-2">
        <h1 class="text-lg font-bold text-gray-800 flex items-center gap-1.5">
            <span>👶</span> Jinx Kids Store
        </h1>
        <div class="bg-pink-100 text-pink-700 px-3 py-1.5 rounded-full text-xs font-bold shadow-sm">
            កន្ត្រក: <span id="cartCount">0</span>
        </div>
    </div>

    <!-- Main Container -->
    <div class="max-w-4xl mx-auto p-4 pt-0">
        <!-- Header Banner -->
        <div class="bg-gradient-to-r from-pink-400 to-rose-400 rounded-2xl p-6 text-white shadow-md mb-6">
            <h2 class="text-2xl font-bold mb-1">ឃ្លាំងសម្លៀកបំពាក់កូនក្មេង Jinx</h2>
            <p class="text-sm opacity-90 mb-4">គុណភាពជំនឿចិត្ត មិនរើសាស់ សម្រាប់ក្មេងៗគ្រប់វ័យ។</p>
            <a href="https://t.me/jinxboutique" target="_blank" class="inline-block bg-white text-pink-600 px-4 py-2 rounded-xl font-bold text-sm shadow">ទិញទំនិញឥឡូវនេះ</a>
        </div>

        <h3 class="text-lg font-bold text-gray-800 mb-4">ផលិតផលទាំងអស់</h3>

        <!-- Product Grid -->
        <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-4">
            <!-- ផលិតផលនឹងទាញមកបង្ហាញទីនេះដោយស្វ័យប្រវត្តិ -->
        </div>

        <!-- ពេលអត់ទាន់មានទំនិញ -->
        <div id="noProduct" class="text-center py-12 text-gray-400 text-sm hidden">
            មិនទាន់មានទំនិញក្នុង Database ទេ!
        </div>
    </div>

    <!-- Modal សម្រាប់បង្ហាញរូបភាព -->
    <div id="productModal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-5 relative max-h-[90vh] overflow-y-auto shadow-2xl">
            <button onclick="closeProductDetail()" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 font-bold text-xl px-2">✕</button>
            
            <h3 id="modalTitle" class="text-base font-bold text-gray-800 mb-3 pr-6"></h3>
            
            <!-- កន្លែងបង្ហាញរូបភាព -->
            <div id="modalImages" class="flex flex-col gap-3 mb-4">
                <!-- រូបភាពនឹងលោតមកទីនេះ -->
            </div>

            <p id="modalPrice" class="text-pink-600 font-bold text-base mb-4"></p>
            
            <a href="https://t.me/jinxboutique" target="_blank" class="block text-center w-full bg-pink-600 hover:bg-pink-700 text-white py-2.5 rounded-xl font-bold text-sm shadow">កម្មង់ទិញតាម Telegram</a>
        </div>
    </div>

    <!-- Firebase SDK & Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            projectId: "project-a9206" 
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadProducts() {
            const grid = document.getElementById('productGrid');
            const noProduct = document.getElementById('noProduct');
            grid.innerHTML = '<p class="col-span-full text-center text-gray-400 py-8">កំពុងទាញទិន្នន័យ...</p>';

            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                grid.innerHTML = '';

                if (querySnapshot.empty) {
                    noProduct.classList.remove('hidden');
                    return;
                }

                noProduct.classList.add('hidden');

                querySnapshot.forEach((doc) => {
                    const item = doc.data();
                    const name = item.name || 'គ្មានឈ្មោះ';
                    const price = item.price || 0;
                    const category = item.category || 'ทั่วไป';
                    
                    // កំណត់ Link រូបភាពដោយស្វ័យប្រវត្តិ (បងគ្រាន់តែដាក់ឈ្មោះ ፋይል ក្នុង Firebase ឧទាហរណ៍ 1.jpg)
                    let imgFileName = item.image || item.images || '1.jpg';
                    if (typeof imgFileName === 'string' && imgFileName.startsWith('http')) {
                        // បើដាក់ Link ពេញមកស្រាប់ យកប្រើផ្ទាល់
                    } else {
                        // បើដាក់តែឈ្មោះរូប ភ្ជាប់ជាមួយ GitHub Repository របស់បង
                        imgFileName = `https://yunsopha999.github.io/jinx-store/${imgFileName}`;
                    }

                    const imagesList = [imgFileName];

                    const card = document.createElement('div');
                    card.className = "bg-white rounded-2xl shadow-sm overflow-hidden border border-pink-100 flex flex-col justify-between cursor-pointer hover:shadow-md transition";
                    card.onclick = () => openProductDetail(name, price, imagesList);

                    card.innerHTML = `
                        <div>
                            <img src="${imgFileName}" alt="${name}" class="w-full h-48 object-cover bg-pink-50" onerror="this.src='https://via.placeholder.com/300'">
                            <div class="p-3.5">
                                <span class="inline-block text-[10px] bg-pink-50 text-pink-600 px-2 py-0.5 rounded-full mb-1">${category}</span>
                                <h4 class="text-xs font-bold text-gray-800 line-clamp-1">${name}</h4>
                                <p class="text-pink-600 font-bold text-sm mt-1">$${price}</p>
                            </div>
                        </div>
                        <div class="p-3.5 pt-0">
                            <button onclick="event.stopPropagation(); openProductDetail('${name.replace(/'/g, "\\'")}', ${price}, ${JSON.stringify(imagesList).replace(/"/g, '&quot;')})" class="w-full bg-pink-600 hover:bg-pink-700 text-white py-2 rounded-xl text-xs font-bold shadow-sm transition">
                                កម្មង់ទិញ
                            </button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                console.error("Error loading products: ", error);
                grid.innerHTML = '<p class="col-span-full text-center text-red-400 py-8">មានបញ្ហាក្នុងការទាញទិន្នន័យពី Firebase!</p>';
            }
        }

        loadProducts();
    </script>

    <!-- Global Functions for Modal -->
    <script>
        window.openProductDetail = function(name, price, images) {
            document.getElementById('modalTitle').innerText = name;
            document.getElementById('modalPrice').innerText = '$' + price;
            
            const imageContainer = document.getElementById('modalImages');
            imageContainer.innerHTML = '';
            
            if (!images || images.length === 0) {
                images = ['https://via.placeholder.com/300'];
            }

            images.forEach(imgUrl => {
                imageContainer.innerHTML += `<img src="${imgUrl}" class="w-full h-72 object-cover rounded-xl border border-pink-100 shadow-sm" onerror="this.src='https://via.placeholder.com/300'">`;
            });
            
            document.getElementById('productModal').classList.remove('hidden');
        };

        window.closeProductDetail = function() {
            document.getElementById('productModal').classList.add('hidden');
        };
    </script>
</body>
</html>
