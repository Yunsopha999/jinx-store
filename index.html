<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jinx Kids Store</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kantumruy Pro', sans-serif; }
    </style>
</head>
<body class="bg-pink-50 min-p-4 pb-12">

    <!-- Header Banner -->
    <div class="max-w-4xl mx-auto p-4">
        <div class="bg-gradient-to-r from-pink-400 to-rose-400 rounded-2xl p-6 text-white shadow-md mb-6">
            <h1 class="text-2xl font-bold mb-1">ឃ្លាំងសម្លៀកបំពាក់កូនក្មេង Jinx</h1>
            <p class="text-sm opacity-90 mb-4">គុណភាពជំនឿចិត្ត មិនរើសាស់ សម្រាប់ក្មេងៗគ្រប់វ័យ។</p>
            <a href="https://t.me/jinxboutique" target="_blank" class="inline-block bg-white text-pink-600 px-4 py-2 rounded-xl font-bold text-sm shadow">ទិញទំនិញូរដូវនេះ</a>
        </div>

        <h2 class="text-lg font-bold text-gray-800 mb-4">ផលិតផលទាំងអស់</h2>

        <!-- Product Grid -->
        <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-4">
            <!-- ផលិតផលនឹងទាញមកបង្ហាញទីនេះដោយស្វ័យប្រវត្តិ -->
        </div>

        <!-- ពេលអត់ទាន់មានទំនិញ -->
        <div id="noProduct" class="text-center py-12 text-gray-400 text-sm hidden">
            មិនទាន់មានទំនិញក្នុង Database ទេ!
        </div>
    </div>

    <!-- Modal សម្រាប់បង្ហាញរូបភាពច្រើន (Gallery Modal) -->
    <div id="productModal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-5 relative max-h-[90vh] overflow-y-auto shadow-2xl">
            <button onclick="closeProductDetail()" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 font-bold text-xl px-2">✕</button>
            
            <h3 id="modalTitle" class="text-base font-bold text-gray-800 mb-3 pr-6"></h3>
            
            <!-- កន្លែងបង្ហាញរូបភាពច្រើនសន្លឹកតម្រៀបគ្នា -->
            <div id="modalImages" class="flex flex-col gap-3 mb-4">
                <!-- រូបភាពនឹងលោតមកទីនេះ -->
            </div>

            <p id="modalPrice" class="text-pink-600 font-bold text-base mb-4"></p>
            
            <a href="https://t.me/jinxboutique" target="_blank" class="block text-center w-full bg-pink-600 hover:bg-pink-700 text-white py-2.5 rounded-xl font-bold text-sm shadow">បញ្ជាទិញឥឡូវនេះ</a>
        </div>
    </div>

    <!-- Firebase SDK (Modular v9) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Config របស់ហាងបង
        const firebaseConfig = {
            projectId: "jinx-kids-store", // ឬ Project ID របស់បង
            // បើសិនជាកូដចាស់របស់បងមាន config ពេញលេញ អាចយកមកជំនួសត្រង់នេះបាន ប៉ុន្តែបើប្រើ script នេះស្រាប់ វាទាញពី Firestore default
        };

        // ប្រសិនបើកូដចាស់របស់បងភ្ជាប់ Firebase រួចហើយ អាចរក្សាទុកកូដភ្ជាប់ចាស់របស់បង ឬប្រើខាងក្រោមនេះ៖
        const app = initializeApp({
            projectId: "web-jinx" // សូមផ្ទៀងផ្ទាត់ Project ID របស់បងបន្តិចបើខុស តែបើកូដចាស់ដើរស្រាប់ គ្រាន់តែថែម logic ខាងក្រោម
        });
        
        // កូដទាញទិន្នន័យពី Firestore មកបង្ហាញ
        // (ប្រសិនបើបងមានកូដ load products ស្រាប់ អាចប្រើ function openProductDetail ខាងក្រោមនេះបាន)
    </script>

    <!-- Global Functions for Modal -->
    <script>
        // Function បើក Modal ពេលចុចលើទំនិញ
        window.openProductDetail = function(name, price, imagesJson) {
            document.getElementById('modalTitle').innerText = name;
            document.getElementById('modalPrice').innerText = '$' + price;
            
            const imageContainer = document.getElementById('modalImages');
            imageContainer.innerHTML = '';
            
            // แปลง Array រូបភាពមកបង្ហាញ
            let images = [];
            try {
                images = JSON.parse(imagesJson);
            } catch(e) {
                images = [imagesJson];
            }

            if(!images || images.length === 0) {
                images = ['https://via.placeholder.com/300'];
            }

            images.forEach(imgUrl => {
                imageContainer.innerHTML += `<img src="${imgUrl}" class="w-full h-72 object-cover rounded-xl border border-pink-100 shadow-sm">`;
            });
            
            document.getElementById('productModal').classList.remove('hidden');
        };

        window.closeProductDetail = function() {
            document.getElementById('productModal').classList.add('hidden');
        };
    </script>
</body>
</html>
