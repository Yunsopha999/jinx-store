<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jinx - ឃ្លាំងសម្លៀកបំពាក់កូនក្មេង</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kantumruy Pro', sans-serif; }
    </style>
</head>
<body class="bg-pink-50 text-gray-800 pb-24">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-base font-bold text-pink-600">👶 Jinx Kids Store</h1>
            <span id="cart-badge" class="text-xs bg-pink-100 text-pink-600 px-2.5 py-1 rounded-full font-medium">កន្រ្តក: 0</span>
        </div>
    </header>

    <!-- Banner -->
    <section class="max-w-md mx-auto px-4 mt-4">
        <div class="bg-gradient-to-r from-pink-500 to-rose-400 rounded-2xl p-5 text-white shadow-md">
            <h2 class="text-xl font-bold mb-1">សម្លៀកបំពាក់កូនក្មេង Jinx</h2>
            <p class="text-xs opacity-90 mb-3">ក្រណាត់ទន់ស្រួលស្លៀក មិនរមាស់ សម្រាប់ក្មេងៗគ្រប់វ័យ។</p>
            <a href="#products" class="inline-block bg-white text-pink-600 text-xs font-bold px-4 py-2 rounded-lg shadow">ទិញទំនិញឥឡូវនេះ</a>
        </div>
    </section>

    <!-- Products List -->
    <main id="products" class="max-w-md mx-auto px-4 mt-6">
        <h3 class="text-sm font-bold mb-3 text-gray-700">សម្លៀកបំពាក់គ្រប់ម៉ូត</h3>
        
        <div id="product-grid" class="grid grid-cols-2 gap-3">
            <p class="text-xs text-gray-500 col-span-2 text-center py-5">សូមរង់ចាំបន្តិច!</p>
        </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 py-2 shadow-lg z-50">
        <div class="max-w-md mx-auto flex justify-around text-center">
            <a href="#" class="text-pink-600 text-xs font-bold flex flex-col items-center">
                🏠 <span class="mt-0.5">ទំព័រដើម</span>
            </a>
            <a href="#products" class="text-gray-400 text-xs font-medium flex flex-col items-center">
                🛍️ <span class="mt-0.5">ផលិតផល</span>
            </a>
            <a href="#" onclick="alert('សូមទាក់ទងមកកាន់ Telegram ហាង Jinx ផ្ទាល់!')" class="text-gray-400 text-xs font-medium flex flex-col items-center">
                💬 <span class="mt-0.5">ទំនាក់ទំនង</span>
            </a>
        </div>
    </nav>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBKYy312ZnNYWHU20n62yIpOyMbdGhqiK8",
            authDomain: "project-a9206.firebaseapp.com",
            projectId: "project-a9206",
            storageBucket: "project-a9206.firebasestorage.app",
            messagingSenderId: "425785620921",
            appId: "1:425785620921:web:f679c97b4d92c42a255e68",
            measurementId: "G-TfYN3E249K"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadProducts() {
            const grid = document.getElementById('product-grid');
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                if(querySnapshot.empty) {
                    grid.innerHTML = `<p class="text-xs text-red-400 col-span-2 text-center py-5">រកមិនឃើញ Collection "products" ក្នុង Firebase ទេ!</p>`;
                    return;
                }
                
                grid.innerHTML = "";
                querySnapshot.forEach((doc) => {
                    const item = doc.data();
                    grid.innerHTML += `
                        <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-pink-100 flex flex-col justify-between">
                            <div>
                                <img src="${item.image || 'https://via.placeholder.com/150'}" alt="${item.name}" class="w-full h-36 object-cover bg-pink-100">
                                <div class="p-3">
                                    <span class="text-[10px] bg-pink-50 text-pink-600 px-2 py-0.5 rounded">${item.category || 'ទូទៅ'}</span>
                                    <h4 class="text-xs font-bold text-gray-800 line-clamp-1 mt-1">${item.name}</h4>
                                    <p class="text-pink-600 font-bold text-xs mt-1">$${item.price}</p>
                                </div>
                            </div>
                            <div class="p-3 pt-0">
                                <button onclick="orderProduct('${item.name}', '${item.price}')" class="w-full bg-pink-600 hover:bg-pink-700 text-white text-xs py-2 rounded-lg font-medium transition">កុម្ម៉ង់ទិញ</button>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error("Error loading products: ", error);
                grid.innerHTML = `<p class="text-xs text-red-500 col-span-2 text-center py-5">មានបញ្ហា kết nối Database: ${error.message}</p>`;
            }
        }

        loadProducts();
    </script>

    <script>
        function orderProduct(name, price) {
            alert("បានជ្រើសរើស: " + name + " (តម្លៃ: $" + price + "). សូមឆាតមក Telegram ដើម្បីបញ្ជាក់ទីតាំងដឹកជញ្ជូន!");
        }
    </script>
</body>
</html>
